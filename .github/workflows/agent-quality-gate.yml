name: 🛡️ Lexora Quality Gate & CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🏗️ Build & Quality Gate Verification
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore Lexora.slnx

      - name: 🔍 Architecture Boundary Check
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .agents/skills/clean-architecture-lint/scripts/lint_architecture.ps1

      - name: 🌐 Localization Parity Check (i18n)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .agents/skills/i18n-localization-sync/scripts/sync_localization.ps1

      - name: 🔨 Solution Build (Zero Warnings / Errors Gate)
        shell: pwsh
        run: |
          $buildOutput = dotnet build Lexora.slnx -c Release -v q /clp:ErrorsOnly -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with errors or warnings!"
            exit 1
          }
          Write-Host "✅ Build completed with 0 warnings and 0 errors."

      - name: 🧪 Execute Automated Test Suite
        shell: pwsh
        run: |
          dotnet test Lexora.slnx -c Release --no-build --logger "console;verbosity=minimal"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test suite regressions detected!"
            exit 1
          }
          Write-Host "✅ All tests passed successfully."

      - name: 🤖 Execute AI Skill Smoke Test
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .agents/skills/lexora-quality-audit/scripts/audit_quality_gates.ps1 -Mode BuildOnly
