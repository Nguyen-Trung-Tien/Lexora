name: 🛡️ Lexora Quality Gate & CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🏗️ Build & Quality Gate Verification
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore Lexora.slnx

      - name: 🔍 Architecture Boundary Check
        shell: pwsh
        run: |
          Write-Host "Verifying Clean Architecture presentation boundary..."
          $efMatches = Select-String -Path src/Lexora.Presentation/**/*.cs -Pattern "LexoraDbContext|Microsoft.EntityFrameworkCore" -SimpleMatch
          if ($efMatches) {
            Write-Error "Clean Architecture Violation: Presentation layer directly references EF Core!"
            $efMatches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber)" }
            exit 1
          }
          Write-Host "✅ Clean Architecture boundary verified: Presentation layer is pure."

      - name: 🔨 Solution Build (Zero Warnings / Errors Gate)
        shell: pwsh
        run: |
          $buildOutput = dotnet build Lexora.slnx -c Release -v q /clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with errors!"
            exit 1
          }
          Write-Host "✅ Build completed with 0 errors."

      - name: 🧪 Execute Automated Test Suite (343 Tests)
        shell: pwsh
        run: |
          dotnet test Lexora.slnx -c Release --no-build --logger "console;verbosity=minimal"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test suite regressions detected!"
            exit 1
          }
          Write-Host "✅ All 343 tests passed successfully."

      - name: 🤖 Execute AI Skill Smoke Test
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .agents/skills/lexora-quality-audit/scripts/audit_quality_gates.ps1 -Mode BuildOnly
